[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monitoring-ml"
version = "0.1.0"
description = "Salesforce monitoring ML shadow mode engines (deterministic, stdlib-only)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13",
]

[tool.setuptools]
packages = ["ml"]