[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sf-mcp-auth"
version = "0.1.0"
description = "OAuth2 client + bootstrap for Salesforce Hosted MCP servers with automatic refresh token rotation (agnostic, stdlib-only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["salesforce", "mcp", "oauth2", "refresh-token-rotation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.scripts]
sf-mcp-auth-bootstrap = "sf_mcp_auth.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]