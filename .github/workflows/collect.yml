name: Collect

on:
  schedule:
    # Every 15 minutes (24/7 data collection per ADR-008)
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          for d in services/*/; do
            pip install -r "$d/requirements.txt"
            pip install -e "$d"
          done
          pip install -r monitoring/requirements.txt

      - name: Compute stamp
        id: stamp
        run: |
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "stamp=$(date -u +%Y-%m-%dT%H-%M-%SZ)" >> "$GITHUB_OUTPUT"

      - name: Fetch persisted refresh token from data branch
        run: |
          mkdir -p out
          git fetch origin data 2>/dev/null || true
          git show FETCH_HEAD:.rt.enc > out/.rt.enc 2>/dev/null || true
          if [ ! -s out/.rt.enc ]; then rm -f out/.rt.enc; fi

      - name: Run pipeline (real MCP mode)
        id: pipeline
        env:
          SALESFORCE_MCP_URL: ${{ secrets.SALESFORCE_MCP_URL }}
          SALESFORCE_MCP_TOKEN: ${{ secrets.SALESFORCE_MCP_TOKEN }}
          SALESFORCE_MCP_CLIENT_ID: ${{ secrets.SALESFORCE_MCP_CLIENT_ID }}
          SALESFORCE_MCP_REFRESH_TOKEN: ${{ secrets.SALESFORCE_MCP_REFRESH_TOKEN }}
          SALESFORCE_MCP_RT_KEY: ${{ secrets.SALESFORCE_MCP_RT_KEY }}
        run: |
          mkdir -p out
          (cd monitoring && python orchestrate.py --mode real \
            --log-file "../out/${{ steps.stamp.outputs.stamp }}.json" \
            --refresh-token-file "../out/.rt.enc")

      # Persist rotated refresh token + snapshot in one atomic push.
      # runs even when pipeline fails (if: always) so that a refresh
      # token rotated mid-pipeline is never lost.  Salesforce rotates
      # refresh tokens on every use — losing the new token = next run
      # dies with invalid_grant.
      - uses: actions/checkout@v4
        if: always() && steps.stamp.outputs.stamp != ''
        with:
          ref: data
          path: data-branch
        continue-on-error: true

      - name: Persist to data branch (always)
        if: always() && steps.stamp.outputs.stamp != ''
        run: |
          set -e
          DATE="${{ steps.stamp.outputs.date }}"
          STAMP="${{ steps.stamp.outputs.stamp }}"
          cd data-branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet refs/heads/data; then
            git checkout data
            git pull --rebase origin data 2>/dev/null || true
          else
            git checkout -b data
          fi
          # 1. Always persist rotated refresh token (if present)
          if [ -s "../out/.rt.enc" ]; then
            cp "../out/.rt.enc" ".rt.enc"
            git add .rt.enc
          fi
          # 2. Persist snapshot if pipeline produced it
          if [ -f "../out/${STAMP}.json" ]; then
            mkdir -p "data/${DATE}"
            cp "../out/${STAMP}.json" "data/${DATE}/${STAMP}.json"
            git add "data/${DATE}/${STAMP}.json"
          fi
          git commit -m "data: ${STAMP}" || { echo "No changes"; exit 0; }
          git push origin data

      - name: Upload snapshot artifact
        if: always() && steps.stamp.outputs.stamp != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stamp.outputs.stamp }}
          path: out/${{ steps.stamp.outputs.stamp }}.json
          retention-days: 7
