[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monitoring-shared"
version = "0.1.0"
description = "Shared utilities for Salesforce monitoring services"
requires-python = ">=3.11"
dependencies = [
    "structlog>=26",
]

[tool.setuptools]
packages = ["shared"]