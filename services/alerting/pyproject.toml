[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monitoring-alerting"
version = "0.1.0"
description = "Salesforce monitoring alert aggregation and deduplication service"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13",
]

[tool.setuptools]
packages = ["alerting"]