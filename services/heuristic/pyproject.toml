[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monitoring-heuristic"
version = "0.1.0"
description = "Salesforce log heuristic analysis service"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13",
]

[tool.setuptools]
packages = ["heuristic"]