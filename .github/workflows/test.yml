name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          for d in services/*/; do
            pip install -r "$d/requirements.txt"
            pip install -e "$d"
          done
          pip install -r monitoring/requirements.txt

      - name: Lint
        run: python -m ruff check services monitoring

      - name: Format check
        run: python -m ruff format --check services monitoring

      - name: Run service tests
        run: |
          for d in services/*/; do
            (cd "$d" && python -m pytest)
          done

      - name: Run pipeline tests
        run: (cd monitoring && python -m pytest)

      - name: Security audit (Python)
        run: |
          pip install pip-audit
          for d in services/*/; do
            pip-audit -r "$d/requirements.txt"
          done
          pip-audit -r monitoring/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Run frontend tests
        working-directory: site
        run: npm test

      - name: Check dashboard mirrors are in sync
        run: node site/scripts/sync-dashboard.mjs --check

      - name: Security audit (npm)
        working-directory: site
        run: npm audit --audit-level=high