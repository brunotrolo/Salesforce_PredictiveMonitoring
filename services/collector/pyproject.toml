[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monitoring-collector"
version = "0.1.0"
description = "Salesforce log collector service"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13",
    "requests>=2.34",
    "structlog>=26",
    "pyyaml>=6",
]

[tool.setuptools]
packages = ["collector"]