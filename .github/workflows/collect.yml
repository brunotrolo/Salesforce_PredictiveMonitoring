name: Collect

on:
  # Schedule TEMPORARILY DISABLED (2026-08-21): cron runs were consuming
  # refresh tokens faster than the GitHub App installation token could
  # rotate them back, and concurrent manual dispatches raced against the
  # cron. Re-enable after manual validation of the rotation + permissions
  # fix lands (see PR for context).
  #
  # schedule:
  #   - cron: "*/5 * * * *"
  #   - cron: "2-59/5 * * * *"
  workflow_dispatch: {}

# Only one collection at a time: two overlapping runs both refresh the
# same OAuth refresh token, and Salesforce rotates (invalidates) the token
# on every refresh — the loser would fail AND could regress the secret.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    # secrets context is not allowed in step `if:` - expose via job env
    # (the standard workaround) so the mint step can check presence.
    env:
      GH_APP_ID: ${{ secrets.APP_ID }}
      GH_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          for d in services/*/; do
            pip install -r "$d/requirements.txt"
            pip install -e "$d"
          done
          pip install -r monitoring/requirements.txt

      - name: Compute stamp
        id: stamp
        run: |
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "stamp=$(date -u +%Y-%m-%dT%H-%M-%SZ)" >> "$GITHUB_OUTPUT"

      # PAT-free rotation: mint a 1-hour installation token from the GitHub App.
      # Skipped while the App triplet is not configured.
      #
      # The `permissions` block is required: without it, the token inherits
      # the app's installation defaults, and the rotate step (which calls
      # `gh secret set`) cannot persist the rotated refresh token back to
      # SF_REFRESH_TOKEN — observed on 2026-08-21 (cron was consuming tokens
      # faster than the secret could be updated). The GitHub App itself must
      # have `secrets: write` granted at installation time; if it doesn't,
      # the mint step below will fail with a 422 from the App APIs.
      - name: Mint GitHub App token (PAT-free rotation)
        id: app_token
        if: ${{ env.GH_APP_ID != '' && env.GH_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permissions: |
            contents: read
            secrets: write

      - name: Fetch previous snapshot (recurrence history)
        id: history
        run: |
          set -e
          git fetch origin data 2>/dev/null || { echo "no previous snapshot (first run)"; exit 0; }
          git worktree add data-branch origin/data
          LATEST=$(cd data-branch && find data -name '*.json' -not -name '*.failure.json' -type f | sort | tail -n 1)
          if [ -n "$LATEST" ]; then
            mkdir -p out
            cp "data-branch/${LATEST}" out/previous.json
            echo "history-file=out/previous.json" >> "$GITHUB_OUTPUT"
            echo "Using previous snapshot: ${LATEST}"
          else
            echo "No previous snapshot found (first run)"
          fi
          if [ -f "data-branch/feedback.json" ]; then
            mkdir -p out
            cp "data-branch/feedback.json" out/feedback.json
            echo "feedback-file=out/feedback.json" >> "$GITHUB_OUTPUT"
            echo "Using feedback file: feedback.json (branch data)"
          else
            echo "No feedback file found on branch data"
          fi
          if [ -f "data-branch/calibration.json" ]; then
            mkdir -p out
            cp "data-branch/calibration.json" out/calibration.json
            echo "calibration-file=out/calibration.json" >> "$GITHUB_OUTPUT"
            echo "Using calibration samples: calibration.json (branch data)"
          else
            echo "No calibration file found on branch data (auto-calibration starts empty)"
          fi
          if [ -f "data-branch/trace.json" ]; then
            mkdir -p out
            cp "data-branch/trace.json" out/trace.json
            echo "Using rolling 24h trace: trace.json (branch data)"
          else
            echo "No trace file found on branch data (trace starts empty)"
          fi
          git worktree remove data-branch --force 2>/dev/null || true

      - name: Start Prometheus server (background)
        run: |
          PROM_PORT=9090 PROM_DIR=out python monitoring/prometheus_server.py &
          echo "PROM_PID=$!" >> "$GITHUB_ENV"
          # Brief wait so /health is reachable before the pipeline starts
          sleep 2
          curl -sf http://localhost:9090/health || echo "Prometheus server not yet ready (no .prom files)"

      - name: Run pipeline (real MCP mode)
        id: pipeline
        env:
          SALESFORCE_MCP_URL: ${{ secrets.SALESFORCE_MCP_URL }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
          SF_REFRESH_TOKEN: ${{ secrets.SF_REFRESH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          mkdir -p out
          HISTORY=""
          if [ -n "${{ steps.history.outputs.history-file }}" ]; then
            HISTORY="--history-file ${{ steps.history.outputs.history-file }}"
          fi
          FEEDBACK=""
          if [ -n "${{ steps.history.outputs.feedback-file }}" ]; then
            FEEDBACK="--feedback-file ${{ steps.history.outputs.feedback-file }}"
          fi
          SAMPLES=""
          if [ -n "${{ steps.history.outputs.calibration-file }}" ]; then
            SAMPLES="--samples-file ${{ steps.history.outputs.calibration-file }}"
          fi
          python monitoring/orchestrate.py --mode real \
            --log-file "out/${{ steps.stamp.outputs.stamp }}.json" \
            --metrics-file "out/${{ steps.stamp.outputs.stamp }}.prom" \
            --trace-file "out/trace.json" \
            --snapshot-name "${{ steps.stamp.outputs.stamp }}.json" \
            --auth-state-out "out/auth_state.json" \
            ${HISTORY} ${FEEDBACK} ${SAMPLES}

      - name: Verify Prometheus metrics endpoint
        if: always() && env.PROM_PID != ''
        run: |
          set +e
          # Give server a moment to pick up the .prom file
          sleep 1
          echo "=== /health ==="
          curl -sf http://localhost:9090/health | python -m json.tool || echo "health check failed"
          echo ""
          echo "=== /metrics (first 20 lines) ==="
          curl -sf http://localhost:9090/metrics | head -20 || echo "metrics not available"

      - name: Rotate auth secret (refresh token rotation)
        # Salesforce rotates the refresh token on every refresh (mandatory in
        # this org). The pipeline persists the latest token to out/auth_state.json;
        # this step writes it back to the SF_REFRESH_TOKEN secret so the next run
        # always starts with the current token.
        #
        # Auth to the Secrets API uses the GitHub App installation token
        # (minted above, 1h, PAT-free).
        if: always() && steps.stamp.outputs.stamp != ''
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then
            echo "No GitHub App token - skipping secret rotation"
            exit 0
          fi
          if [ ! -f "out/auth_state.json" ]; then
            echo "No auth_state.json - nothing to rotate"
            exit 0
          fi
          NEW_TOKEN=$(python -c "import json;print(json.load(open('out/auth_state.json'))['refresh_token'])")
          OLD_TOKEN=$(python -c "import json;print(json.load(open('out/auth_state.json')).get('refresh_token_initial') or '')")
          if [ -z "$NEW_TOKEN" ] || [ "$NEW_TOKEN" = "$OLD_TOKEN" ]; then
            echo "Token not rotated this run - skipping"
            exit 0
          fi
          gh secret set SF_REFRESH_TOKEN --body "$NEW_TOKEN"
          echo "SF_REFRESH_TOKEN rotated"

      - name: Persist snapshot to data branch
        if: always() && steps.stamp.outputs.stamp != ''
        run: |
          set -e
          DATE="${{ steps.stamp.outputs.date }}"
          STAMP="${{ steps.stamp.outputs.stamp }}"
          HAS_SNAPSHOT="false"
          HAS_FAILURE="false"
          if [ -f "out/${STAMP}.json" ]; then
            HAS_SNAPSHOT="true"
          fi
          if [ -f "out/${STAMP}.json.failure.json" ]; then
            HAS_FAILURE="true"
          fi
          if [ "$HAS_SNAPSHOT" = "false" ] && [ "$HAS_FAILURE" = "false" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin data 2>/dev/null || true
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            git worktree add data-branch origin/data
          else
            git worktree add data-branch -b data
          fi
          cd data-branch
          if [ "$HAS_SNAPSHOT" = "true" ]; then
            mkdir -p "data/${DATE}"
            cp "../out/${STAMP}.json" "data/${DATE}/${STAMP}.json"
            if [ -f "../out/${STAMP}.prom" ]; then
              cp "../out/${STAMP}.prom" "data/${DATE}/${STAMP}.prom"
            fi
          fi
          if [ "$HAS_FAILURE" = "true" ]; then
            mkdir -p "data/${DATE}/failures"
            cp "../out/${STAMP}.json.failure.json" "data/${DATE}/failures/${STAMP}.failure.json"
          fi
          if [ -f "../out/calibration.json" ]; then
            cp "../out/calibration.json" calibration.json
          fi
          # The pipeline always writes out/trace.json (created fresh on the
          # first run); keep the rolling 24h trace on the data branch root.
          if [ -f "../out/trace.json" ]; then
            cp "../out/trace.json" trace.json
          fi
          git add "data/${DATE}/"
          if [ -f "calibration.json" ]; then
            git add calibration.json
          fi
          if [ -f "trace.json" ]; then
            git add trace.json
          fi
          git commit -m "data: ${STAMP}" || { echo "No changes"; exit 0; }
          git push origin HEAD:data
          cd ..
          git worktree remove data-branch --force 2>/dev/null || true

      - name: Upload snapshot artifact
        if: always() && steps.stamp.outputs.stamp != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stamp.outputs.stamp }}
          path: |
            out/${{ steps.stamp.outputs.stamp }}.json
            out/${{ steps.stamp.outputs.stamp }}.prom
            out/${{ steps.stamp.outputs.stamp }}.json.failure.json
          if-no-files-found: warn
          retention-days: 7

      - name: Stop Prometheus server
        if: always() && env.PROM_PID != ''
        run: |
          kill "$PROM_PID" 2>/dev/null || true
          echo "Prometheus server stopped"
