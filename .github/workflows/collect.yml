name: Collect

on:
  schedule:
    # Every 15 minutes (24/7 data collection per ADR-008)
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          for d in services/*/; do
            pip install -r "$d/requirements.txt"
            pip install -e "$d"
          done
          pip install -r monitoring/requirements.txt

      - name: Compute stamp
        id: stamp
        run: |
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "stamp=$(date -u +%Y-%m-%dT%H-%M-%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run pipeline (real MCP mode)
        id: pipeline
        env:
          SALESFORCE_MCP_URL: ${{ secrets.SALESFORCE_MCP_URL }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
          SF_REFRESH_TOKEN: ${{ secrets.SF_REFRESH_TOKEN }}
        run: |
          mkdir -p out
          (cd monitoring && python orchestrate.py --mode real \
            --log-file "../out/${{ steps.stamp.outputs.stamp }}.json")

      - name: Persist snapshot to data branch
        if: always() && steps.stamp.outputs.stamp != ''
        run: |
          set -e
          DATE="${{ steps.stamp.outputs.date }}"
          STAMP="${{ steps.stamp.outputs.stamp }}"
          [ ! -f "out/${STAMP}.json" ] && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin data 2>/dev/null || true
          git worktree add data-branch origin/data 2>/dev/null || \
            git worktree add data-branch -b data origin/data 2>/dev/null || true
          cd data-branch
          mkdir -p "data/${DATE}"
          cp "../out/${STAMP}.json" "data/${DATE}/${STAMP}.json"
          git add "data/${DATE}/${STAMP}.json"
          git commit -m "data: ${STAMP}" || { echo "No changes"; exit 0; }
          git push origin data
          cd ..
          git worktree remove data-branch --force 2>/dev/null || true

      - name: Upload snapshot artifact
        if: always() && steps.stamp.outputs.stamp != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stamp.outputs.stamp }}
          path: out/${{ steps.stamp.outputs.stamp }}.json
          retention-days: 7
